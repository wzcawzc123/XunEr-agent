name: PR Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 名称是 main 分支规则集 main-protection 的必需检查（required_status_checks 上下文）。
    # 改名会让门禁对不上号，必须同步更新仓库规则集。
    name: Lint / Test / Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      # PR 来自 fork 时拿不到 Secrets，这里只做无需签名的检查
      # 提交号取 PR 头部提交，而非 GitHub 生成的临时合并提交
      - name: Lint、单元测试与 Debug 构建
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          "-Peta.buildMetadata=${HEAD_SHA::7}"
          :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      # 绿的时候也要留下用例数：Gradle 默认只在失败时打印
      - name: 汇总单元测试结果
        if: always()
        run: python3 .github/scripts/test-summary.py app/build/test-results/testDebugUnitTest

      - name: 上传检查报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-check-reports
          path: |
            app/build/reports/lint-results-*
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
