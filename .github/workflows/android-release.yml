name: Eta Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的版本 tag（如 v3.4.0）。留空则只构建、不发布。"
        required: false
        type: string
      debuggable:
        description: "出「正式签名 + debuggable」包，供 adb run-as 读取私有数据目录排查线上问题。"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 与打包并行且不接触签名 Secrets；失败不影响 APK 上传，但会阻止发版草稿
  verify:
    name: Lint 与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: Lint 与单元测试
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          :app:lintDebug :app:testDebugUnitTest

      - name: 上传检查报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-apks:
    name: 构建 Debug 与 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      release_apk_name: ${{ steps.apk.outputs.release_name }}

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 还原发布证书
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$ETA_RELEASE_KEYSTORE_BASE64" ||
                -z "$ETA_RELEASE_STORE_PASSWORD" ||
                -z "$ETA_RELEASE_KEY_ALIAS" ||
                -z "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::缺少 Release 签名 Secrets，请检查仓库的 Actions Secrets。"
            exit 1
          fi
          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/eta-release.jks"

      - name: 运行单元测试
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:testDebugUnitTest

      - name: 构建 Debug 与 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          extra=""
          if [[ "${{ inputs.debuggable }}" == "true" ]]; then
            extra="-PetaDebuggable=true"
            echo "本次 release 包将打开 debuggable —— 仅供排查线上问题，不要用于发布。"
          fi
          ./gradlew --no-daemon --no-configuration-cache $extra \
            :app:assembleDebug :app:assembleRelease

      - name: 验证并整理 APK
        id: apk
        run: |
          if [[ "${{ inputs.debuggable }}" == "true" && -n "${{ inputs.release_tag }}" ]]; then
            echo "::error::debuggable 与 release_tag 不能同时使用：可调试包不得发布。"
            exit 1
          fi

          # APK 文件名由 Gradle 按 versionName 生成（Eta-vX.Y.Z.apk / Eta-vX.Y.Z-debug+<sha>.apk），
          # 用通配符查找，避免与产物命名规则耦合。
          debug_apk="$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n1)"
          release_apk="$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n1)"
          if [[ -z "$debug_apk" || -z "$release_apk" ]]; then
            echo "::error::未找到 APK 产物（debug=$debug_apk release=$release_apk）。"
            exit 1
          fi
          output_dir="$RUNNER_TEMP/apks"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          "$apksigner_path" verify "$release_apk"
          mkdir -p "$output_dir"
          cp "$debug_apk" "$output_dir/app-debug.apk"
          release_name="app-release.apk"
          if [[ "${{ inputs.debuggable }}" == "true" ]]; then
            release_name="app-release-debuggable.apk"
          fi
          cp "$release_apk" "$output_dir/$release_name"
          echo "debug_path=$output_dir/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "release_path=$output_dir/$release_name" >> "$GITHUB_OUTPUT"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.debug_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      # 两条入口：
      #   1) 推送 v* tag（若本仓库的 push 事件能触发 workflow）；
      #   2) 手动触发 workflow_dispatch 并填 release_tag（本仓库历史一直用手动触发，
      #      实测 push 事件从不产生运行，所以这条是可靠入口）。
      # 正文取自仓库内的 docs/releases/<tag>.md，与历史 release 的手写风格保持一致。
      - name: 创建 GitHub Release
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          notes_file="docs/releases/${tag}.md"
          asset="$RUNNER_TEMP/apks/Eta-${tag}.apk"

          if [[ ! -f "$notes_file" ]]; then
            echo "::error::未找到 Release 正文 $notes_file。"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag 已存在。"
            exit 1
          fi

          # 手动触发时 tag 还不存在，先在本仓建好轻量 tag（与历史 tag 类型一致）并推上去。
          # 用 GITHUB_TOKEN 推送不会反过来再触发一次 workflow，因此不会形成循环。
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} 不存在，创建并指向 ${GITHUB_SHA}"
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi

          cp "${{ steps.apk.outputs.release_path }}" "$asset"
          gh release create "$tag" \
            --title "Eta ${tag}" \
            --notes-file "$notes_file" \
            "$asset"
